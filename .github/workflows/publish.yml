name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | sh
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Install dependencies via pixi
        run: pixi install

      - name: Build _mbpe.so
        run: |
          pixi run mojo build python-binding/mbpe.mojo -I . \
            --emit shared-lib -o python-binding/mbpe/_mbpe.so

      - name: Copy data files into package
        run: |
          mkdir -p python-binding/mbpe/data
          cp data/*.tiktoken python-binding/mbpe/data/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install patchelf (for auditwheel)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Repair wheel (bundle Mojo runtime libs)
        run: |
          pip install auditwheel
          # Point auditwheel at pixi's lib dir so it can find Mojo runtime .so files
          LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib" \
            auditwheel repair dist/*.whl -w dist/
          rm -f dist/*none-any.whl  # remove un-repaired wheel

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
