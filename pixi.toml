[workspace]
channels = ["https://conda.modular.com/max/", "conda-forge"]
name = "simple_bpe"
platforms = ["linux-64"]
version = "0.1.0"

# BPE_PT selects the pre-tokenizer: default/gpt2/gpt4 → -D BPE_PT=0/1/2
[tasks]
benchmark = "bash benchmarks/run.sh"
benchmark-gpt2 = { cmd = "bash benchmarks/run.sh", env = { BPE_PT = "gpt2" } }
benchmark-gpt4 = { cmd = "bash benchmarks/run.sh", env = { BPE_PT = "gpt4" } }
gen-refs = "python benchmarks/reference_splits.py benchmarks/corpus.txt benchmarks/ref_splits.json && python -c \"import json; d=json.load(open('benchmarks/ref_splits.json')); json.dump({k: d[k] for k in ['text','n_gpre','n_gpt2','n_gpt4']}, open('benchmarks/ref_counts.json','w'), ensure_ascii=False)\""

[dependencies]
python = ">=3.14.6,<3.15"
mojo = ">=1.0.0b2,<2"
