[workspace]
channels = ["https://conda.modular.com/max/", "conda-forge"]
name = "mbpe"
platforms = ["linux-64"]
version = "0.1.0"

# BPE_PT selects the pre-tokenizer: default/gpt2/gpt4 → -D BPE_PT=0/1/2
[tasks]
tests = "bash scripts/run_tests.sh"
benchmark = "bash benchmarks/run.sh"
benchmark-gpt2 = { cmd = "bash benchmarks/run.sh", env = { BPE_PT = "gpt2" } }
benchmark-gpt4 = { cmd = "bash benchmarks/run.sh", env = { BPE_PT = "gpt4" } }
gen-refs = "pixi run --environment dev python benchmarks/reference_splits.py benchmarks/corpus.txt benchmarks/ref_splits.json && pixi run --environment dev python -c \"import json; d=json.load(open('benchmarks/ref_splits.json')); json.dump({k: d[k] for k in ['text','n_gpt2','n_gpt4']}, open('benchmarks/ref_counts.json','w'), ensure_ascii=False)\""

[dependencies]
python = ">=3.14.6,<3.15"
mojo = ">=1.0.0b2,<2"
gcc = ">=15.2.0,<15.3"

[feature.dev.pypi-dependencies]
tiktoken = "*"
regex = "*"

[feature.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"

[environments]
dev = { features = ["dev"], solve-group = "default" }
